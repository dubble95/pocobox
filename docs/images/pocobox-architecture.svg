<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="successGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5" />
    </filter>

    <!-- Marker Arrow -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#c084fc" />
    </marker>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; fill: #f8fafc; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; fill: #94a3b8; }
    .sec-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 1px; text-transform: uppercase; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #f1f5f9; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #94a3b8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 10px; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="680" fill="url(#bgGrad)" rx="16" />
  <rect width="1196" height="676" x="2" y="2" fill="none" stroke="#334155" stroke-width="1.5" rx="15" stroke-opacity="0.6" />

  <!-- Header Section -->
  <g transform="translate(60, 48)">
    <rect x="0" y="-8" width="44" height="44" rx="10" fill="url(#primaryGrad)" filter="url(#glow)" opacity="0.8" />
    <text x="12" y="22" font-size="22" fill="#fff">📻</text>
    <text x="56" y="16" class="title" font-size="24">PocoBox Architecture &amp; Data Pipeline</text>
    <text x="56" y="36" class="subtitle" font-size="13">Always-On Audiophile Smart Music Box · Local-First Voice Control · Hardware-Agnostic Linux</text>
  </g>

  <!-- ==================== COLUMN 1: INPUT & SENSING ==================== -->
  <g transform="translate(60, 115)">
    <!-- Group Container -->
    <rect width="320" height="425" rx="14" fill="#0f172a" fill-opacity="0.6" stroke="#1e293b" stroke-width="1.5" />
    <text x="20" y="32" class="sec-title" fill="#38bdf8">1. Input &amp; Perception</text>

    <!-- Card 1.1: Audio Capture & AEC3 -->
    <g transform="translate(16, 50)" filter="url(#shadow)">
      <rect width="288" height="74" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="28" cy="37" r="16" fill="#0284c7" fill-opacity="0.2" />
      <text x="20" y="43" font-size="16">🎙️</text>
      <text x="54" y="30" class="card-title">Dual Mic &amp; Decoupled AEC3</text>
      <text x="54" y="48" class="card-desc">48kHz Audio Decimator + WebRTC AEC3</text>
      <text x="54" y="62" class="card-desc">Squeezelite VISEXPORT reference tap</text>
      <rect x="226" y="12" width="50" height="18" rx="9" fill="#0284c7" fill-opacity="0.25" />
      <text x="234" y="24" class="badge-text" fill="#38bdf8">16kHz</text>
    </g>

    <!-- Card 1.2: Wake Word Spotting -->
    <g transform="translate(16, 138)" filter="url(#shadow)">
      <rect width="288" height="74" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="28" cy="37" r="16" fill="#ca8a04" fill-opacity="0.2" />
      <text x="20" y="43" font-size="16">⚡</text>
      <text x="54" y="30" class="card-title">Streaming Wake-Word Spotter</text>
      <text x="54" y="48" class="card-desc">Local Vosk grammar ("포코야", "Hey Poco")</text>
      <text x="54" y="62" class="card-desc">Auto-ducks music to 18% instantly</text>
      <rect x="212" y="12" width="64" height="18" rx="9" fill="#ca8a04" fill-opacity="0.25" />
      <text x="220" y="24" class="badge-text" fill="#fbbf24">Offline</text>
    </g>

    <!-- Card 1.3: Local SenseVoice STT -->
    <g transform="translate(16, 226)" filter="url(#shadow)">
      <rect width="288" height="84" rx="10" fill="url(#cardGrad)" stroke="#0284c7" stroke-width="1.5" />
      <circle cx="28" cy="42" r="16" fill="#0284c7" fill-opacity="0.25" />
      <text x="20" y="48" font-size="16">🧠</text>
      <text x="54" y="28" class="card-title">SenseVoice-Small INT8 STT</text>
      <text x="54" y="46" class="card-desc">Docker container (:8766) via sherpa-onnx</text>
      <text x="54" y="60" class="card-desc">~150–300ms latency, zero cloud API cost</text>
      <text x="54" y="74" class="card-desc">Adaptive Korean phonetic correction</text>
      <rect x="216" y="12" width="60" height="18" rx="9" fill="#0369a1" fill-opacity="0.4" />
      <text x="224" y="24" class="badge-text" fill="#7dd3fc">&lt; 300ms</text>
    </g>

    <!-- Card 1.4: Hardware / Touch / Kiosk Trigger -->
    <g transform="translate(16, 324)" filter="url(#shadow)">
      <rect width="288" height="74" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="28" cy="37" r="16" fill="#7c3aed" fill-opacity="0.2" />
      <text x="20" y="43" font-size="16">📱</text>
      <text x="54" y="30" class="card-title">Touchscreen &amp; Key Trigger</text>
      <text x="54" y="48" class="card-desc">Fullscreen Now-Playing Kiosk (/display)</text>
      <text x="54" y="62" class="card-desc">Vol-Up hold (&gt;=0.7s) push-to-talk trigger</text>
      <rect x="224" y="12" width="52" height="18" rx="9" fill="#7c3aed" fill-opacity="0.25" />
      <text x="232" y="24" class="badge-text" fill="#c084fc">Direct</text>
    </g>
  </g>

  <!-- ==================== COLUMN 2: CORE LOGIC & MEDIA ==================== -->
  <g transform="translate(440, 115)">
    <!-- Group Container -->
    <rect width="320" height="425" rx="14" fill="#0f172a" fill-opacity="0.6" stroke="#1e293b" stroke-width="1.5" />
    <text x="20" y="32" class="sec-title" fill="#34d399">2. Logic &amp; Music Engine</text>

    <!-- Card 2.1: Rule Fast-Path Parser -->
    <g transform="translate(16, 50)" filter="url(#shadow)">
      <rect width="288" height="84" rx="10" fill="url(#cardGrad)" stroke="#059669" stroke-width="1.5" />
      <circle cx="28" cy="42" r="16" fill="#059669" fill-opacity="0.25" />
      <text x="20" y="48" font-size="16">🚀</text>
      <text x="54" y="28" class="card-title">Offline Rule Engine Fast-Path</text>
      <text x="54" y="46" class="card-desc">Sub-millisecond regex &amp; Jamo matcher</text>
      <text x="54" y="60" class="card-desc">Volume, playback, time, quiz, weather</text>
      <text x="54" y="74" class="card-desc">Escalates Q&amp;A only to Gemini/OpenAI</text>
      <rect x="222" y="12" width="54" height="18" rx="9" fill="#059669" fill-opacity="0.3" />
      <text x="230" y="24" class="badge-text" fill="#6ee7b7">&lt; 1ms</text>
    </g>

    <!-- Card 2.2: Lyrion Music Server -->
    <g transform="translate(16, 148)" filter="url(#shadow)">
      <rect width="288" height="92" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="28" cy="46" r="16" fill="#0284c7" fill-opacity="0.2" />
      <text x="20" y="52" font-size="16">🎵</text>
      <text x="54" y="30" class="card-title">Lyrion Music Server (LMS)</text>
      <text x="54" y="48" class="card-desc">Docker container (:9000, host network)</text>
      <text x="54" y="62" class="card-desc">TIDAL integration, My Mix, Don't Stop Music</text>
      <text x="54" y="76" class="card-desc">Material Skin UI + JSON-RPC API</text>
      <rect x="204" y="12" width="72" height="18" rx="9" fill="#0369a1" fill-opacity="0.25" />
      <text x="212" y="24" class="badge-text" fill="#38bdf8">JSON-RPC</text>
    </g>

    <!-- Card 2.3: YouTube & Interactive Quiz -->
    <g transform="translate(16, 254)" filter="url(#shadow)">
      <rect width="288" height="74" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="28" cy="37" r="16" fill="#e11d48" fill-opacity="0.2" />
      <text x="20" y="43" font-size="16">🎬</text>
      <text x="54" y="30" class="card-title">YouTube Video &amp; Quiz Engine</text>
      <text x="54" y="48" class="card-desc">Continuous K-pop/Classical MV streaming</text>
      <text x="54" y="62" class="card-desc">Bilingual English listening story quiz</text>
      <rect x="214" y="12" width="62" height="18" rx="9" fill="#e11d48" fill-opacity="0.25" />
      <text x="222" y="24" class="badge-text" fill="#fb7185">Bilingual</text>
    </g>

    <!-- Card 2.4: USB DAC Autoplay Watcher -->
    <g transform="translate(16, 342)" filter="url(#shadow)">
      <rect width="288" height="68" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="28" cy="34" r="16" fill="#059669" fill-opacity="0.2" />
      <text x="20" y="40" font-size="16">🔌</text>
      <text x="54" y="28" class="card-title">USB DAC Autoplay &amp; Arbiter</text>
      <text x="54" y="44" class="card-desc">udev monitor: auto-switch Squeezelite</text>
      <text x="54" y="58" class="card-desc">Auto-resume on attach / Pause on detach</text>
    </g>
  </g>

  <!-- ==================== COLUMN 3: DUAL-PATH AUDIO OUTPUT ==================== -->
  <g transform="translate(820, 115)">
    <!-- Group Container -->
    <rect width="320" height="425" rx="14" fill="#0f172a" fill-opacity="0.6" stroke="#1e293b" stroke-width="1.5" />
    <text x="20" y="32" class="sec-title" fill="#c084fc">3. Dual-Path Isolated Audio</text>

    <!-- Card 3.1: Hi-Res Bit-Perfect Music Path -->
    <g transform="translate(16, 50)" filter="url(#shadow)">
      <rect width="288" height="142" rx="10" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.5" />
      <circle cx="28" cy="36" r="16" fill="#a855f7" fill-opacity="0.25" />
      <text x="20" y="42" font-size="16">💎</text>
      <text x="54" y="28" class="card-title">Bit-Perfect Hi-Res Music Path</text>
      <text x="54" y="46" class="card-desc">Native ARM64 Squeezelite player</text>
      <text x="54" y="62" class="card-desc">Direct ALSA hw:CARD=&lt;DAC&gt;,DEV=0</text>
      <text x="54" y="78" class="card-desc">SoXR VHQ linear-phase exception mode</text>
      <text x="54" y="94" class="card-desc">Bypasses PulseAudio &amp; software mixer</text>
      <line x1="20" y1="106" x2="268" y2="106" stroke="#334155" stroke-width="1" />
      <text x="32" y="126" font-size="14">🔊</text>
      <text x="54" y="126" class="card-title" fill="#38bdf8">External USB DAC &amp; Hi-Fi Speakers</text>
      <rect x="208" y="12" width="68" height="18" rx="9" fill="#7c3aed" fill-opacity="0.3" />
      <text x="216" y="24" class="badge-text" fill="#d8b4fe">Bit-Perfect</text>
    </g>

    <!-- Card 3.2: Isolated Voice & TTS Path -->
    <g transform="translate(16, 206)" filter="url(#shadow)">
      <rect width="288" height="136" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="28" cy="36" r="16" fill="#0284c7" fill-opacity="0.2" />
      <text x="20" y="42" font-size="16">🗣️</text>
      <text x="54" y="28" class="card-title">Isolated TTS &amp; Chime Path</text>
      <text x="54" y="46" class="card-desc">Edge Neural TTS + Google TTS fallback</text>
      <text x="54" y="62" class="card-desc">Routed strictly via headless PulseAudio</text>
      <text x="54" y="78" class="card-desc">Never leaks or interrupts USB DAC playback</text>
      <line x1="20" y1="92" x2="268" y2="92" stroke="#334155" stroke-width="1" />
      <text x="32" y="114" font-size="14">📢</text>
      <text x="54" y="112" class="card-title" fill="#94a3b8">Internal Speaker / Onboard 3.5mm</text>
      <text x="54" y="126" class="card-desc">Cues, speech Q&amp;A, English quiz story</text>
      <rect x="220" y="12" width="56" height="18" rx="9" fill="#0369a1" fill-opacity="0.25" />
      <text x="228" y="24" class="badge-text" fill="#38bdf8">Isolated</text>
    </g>

    <!-- Card 3.3: Dynamic VAD Auto-Ducking -->
    <g transform="translate(16, 356)" filter="url(#shadow)">
      <rect width="288" height="60" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="28" cy="30" r="16" fill="#ca8a04" fill-opacity="0.2" />
      <text x="20" y="36" font-size="16">🎚️</text>
      <text x="54" y="26" class="card-title">Dynamic LMS Auto-Ducking</text>
      <text x="54" y="44" class="card-desc">100% -&gt; 18% during voice cmd, smooth restore</text>
    </g>
  </g>

  <!-- ==================== FLOW CONNECTORS ==================== -->
  <!-- Col 1 to Col 2 -->
  <path d="M 380 270 L 440 270" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-blue)" />
  <path d="M 380 180 L 410 180 L 410 92 L 440 92" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrow-blue)" />
  
  <!-- Col 2 to Col 3 -->
  <path d="M 760 194 L 820 120" stroke="#34d399" stroke-width="2" fill="none" marker-end="url(#arrow-green)" />
  <path d="M 760 92 L 790 92 L 790 274 L 820 274" stroke="#c084fc" stroke-width="2" fill="none" marker-end="url(#arrow-purple)" />

  <!-- ==================== BOTTOM: HARDWARE EXTENSIBILITY ==================== -->
  <g transform="translate(60, 560)">
    <rect width="1080" height="90" rx="12" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1.2" />
    <text x="24" y="30" class="sec-title" fill="#f8fafc">Hardware Extensibility &amp; Supported Targets</text>
    <text x="24" y="52" class="card-desc">The entire software stack runs on any standard Linux with systemd, Docker, and ALSA/PulseAudio:</text>

    <!-- Target 1: Smartphone -->
    <g transform="translate(24, 60)">
      <text x="0" y="16" font-size="14">📱</text>
      <text x="24" y="15" class="card-title" font-size="12">Upcycled Flagship Phones</text>
      <text x="175" y="15" class="card-desc">(POCO F1, OnePlus 6, Pixel 3 - All-in-One screen, battery &amp; mic)</text>
    </g>

    <!-- Target 2: SBC -->
    <g transform="translate(490, 60)">
      <text x="0" y="16" font-size="14">🍓</text>
      <text x="24" y="15" class="card-title" font-size="12">Single Board Computers</text>
      <text x="165" y="15" class="card-desc">(Raspberry Pi 4/5, Orange Pi 5, Rock 5)</text>
    </g>

    <!-- Target 3: Mini PC -->
    <g transform="translate(840, 60)">
      <text x="0" y="16" font-size="14">💻</text>
      <text x="24" y="15" class="card-title" font-size="12">Mini PCs &amp; Laptops</text>
      <text x="140" y="15" class="card-desc">(Intel NUC, x86_64, Thin Clients)</text>
    </g>
  </g>
</svg>
