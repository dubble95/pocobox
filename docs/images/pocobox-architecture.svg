<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.4" />
    </filter>

    <!-- Arrows -->
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#34d399" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#c084fc" />
    </marker>
  </defs>

  <style>
    .font-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; }
    .font-sub   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 500; }
    .font-bold  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; }
    .font-body  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 400; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="640" fill="url(#bgGrad)" rx="16" />
  <rect width="1196" height="636" x="2" y="2" fill="none" stroke="#1e293b" stroke-width="1.5" rx="15" />

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(60, 42)">
    <rect x="0" y="-4" width="38" height="38" rx="10" fill="url(#primaryGrad)" filter="url(#glow)" opacity="0.85" />
    <text x="9" y="22" font-size="20">📻</text>
    <text x="50" y="18" class="font-title" font-size="22" fill="#f8fafc">PocoBox Architecture</text>
    <text x="50" y="34" class="font-sub" font-size="12" fill="#64748b">Smart Music Box &amp; Voice Assistant · Modular Linux</text>
  </g>

  <!-- ==================== COLUMN 1: INPUT ==================== -->
  <g transform="translate(60, 100)">
    <rect width="320" height="420" rx="14" fill="#0b1329" fill-opacity="0.5" stroke="#1e293b" stroke-width="1" />
    <text x="24" y="32" class="font-bold" font-size="13" fill="#38bdf8" letter-spacing="1">VOICE &amp; TOUCH INPUT</text>

    <!-- 1.1 Mic + AEC3 -->
    <g transform="translate(16, 48)" filter="url(#cardShadow)">
      <rect width="288" height="68" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="32" cy="34" r="16" fill="#0284c7" fill-opacity="0.2" />
      <text x="23" y="40" font-size="17">🎙️</text>
      <text x="58" y="30" class="font-bold" font-size="14" fill="#f1f5f9">Dual Mic + AEC3</text>
      <text x="58" y="49" class="font-body" font-size="12" fill="#94a3b8">WebRTC Echo Cancellation</text>
      <rect x="228" y="12" width="48" height="18" rx="9" fill="#0284c7" fill-opacity="0.25" />
      <text x="236" y="24" class="font-bold" font-size="10" fill="#38bdf8">16kHz</text>
    </g>

    <!-- 1.2 Wake Word -->
    <g transform="translate(16, 126)" filter="url(#cardShadow)">
      <rect width="288" height="68" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="32" cy="34" r="16" fill="#ca8a04" fill-opacity="0.2" />
      <text x="23" y="40" font-size="17">⚡</text>
      <text x="58" y="30" class="font-bold" font-size="14" fill="#f1f5f9">Wake Word</text>
      <text x="58" y="49" class="font-body" font-size="12" fill="#94a3b8">포코야 · Hey Poco (Vosk)</text>
      <rect x="226" y="12" width="50" height="18" rx="9" fill="#ca8a04" fill-opacity="0.25" />
      <text x="235" y="24" class="font-bold" font-size="10" fill="#fbbf24">Offline</text>
    </g>

    <!-- 1.3 Local STT -->
    <g transform="translate(16, 204)" filter="url(#cardShadow)">
      <rect width="288" height="74" rx="10" fill="url(#cardGrad)" stroke="#0284c7" stroke-width="1.2" />
      <circle cx="32" cy="37" r="16" fill="#0284c7" fill-opacity="0.25" />
      <text x="23" y="43" font-size="17">🧠</text>
      <text x="58" y="32" class="font-bold" font-size="14" fill="#f1f5f9">Local STT</text>
      <text x="58" y="51" class="font-body" font-size="12" fill="#94a3b8">SenseVoice-Small INT8</text>
      <rect x="222" y="12" width="54" height="18" rx="9" fill="#0369a1" fill-opacity="0.35" />
      <text x="228" y="24" class="font-bold" font-size="10" fill="#7dd3fc">200ms</text>
    </g>

    <!-- 1.4 Touchscreen Kiosk -->
    <g transform="translate(16, 288)" filter="url(#cardShadow)">
      <rect width="288" height="68" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="32" cy="34" r="16" fill="#7c3aed" fill-opacity="0.2" />
      <text x="23" y="40" font-size="17">📱</text>
      <text x="58" y="30" class="font-bold" font-size="14" fill="#f1f5f9">Kiosk Display</text>
      <text x="58" y="49" class="font-body" font-size="12" fill="#94a3b8">Now-Playing Touch UI</text>
      <rect x="228" y="12" width="48" height="18" rx="9" fill="#7c3aed" fill-opacity="0.25" />
      <text x="235" y="24" class="font-bold" font-size="10" fill="#c084fc">Kiosk</text>
    </g>
  </g>

  <!-- ==================== COLUMN 2: CORE ==================== -->
  <g transform="translate(440, 100)">
    <rect width="320" height="420" rx="14" fill="#0b1329" fill-opacity="0.5" stroke="#1e293b" stroke-width="1" />
    <text x="24" y="32" class="font-bold" font-size="13" fill="#34d399" letter-spacing="1">CORE &amp; MUSIC ENGINE</text>

    <!-- 2.1 Rule Fast-Path -->
    <g transform="translate(16, 48)" filter="url(#cardShadow)">
      <rect width="288" height="74" rx="10" fill="url(#cardGrad)" stroke="#059669" stroke-width="1.2" />
      <circle cx="32" cy="37" r="16" fill="#059669" fill-opacity="0.25" />
      <text x="23" y="43" font-size="17">🚀</text>
      <text x="58" y="32" class="font-bold" font-size="14" fill="#f1f5f9">Rule Fast-Path</text>
      <text x="58" y="51" class="font-body" font-size="12" fill="#94a3b8">Instant Music / Volume / Quiz</text>
      <rect x="224" y="12" width="52" height="18" rx="9" fill="#059669" fill-opacity="0.3" />
      <text x="232" y="24" class="font-bold" font-size="10" fill="#6ee7b7">&lt; 1ms</text>
    </g>

    <!-- 2.2 LMS Server -->
    <g transform="translate(16, 132)" filter="url(#cardShadow)">
      <rect width="288" height="84" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="32" cy="42" r="16" fill="#0284c7" fill-opacity="0.2" />
      <text x="23" y="48" font-size="17">🎵</text>
      <text x="58" y="34" class="font-bold" font-size="14" fill="#f1f5f9">Lyrion Music Server</text>
      <text x="58" y="54" class="font-body" font-size="12" fill="#94a3b8">TIDAL · YouTube · Local Audio</text>
      <rect x="216" y="12" width="60" height="18" rx="9" fill="#0369a1" fill-opacity="0.25" />
      <text x="224" y="24" class="font-bold" font-size="10" fill="#38bdf8">Docker</text>
    </g>

    <!-- 2.3 DAC Autoplay -->
    <g transform="translate(16, 226)" filter="url(#cardShadow)">
      <rect width="288" height="68" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="32" cy="34" r="16" fill="#059669" fill-opacity="0.2" />
      <text x="23" y="40" font-size="17">🔌</text>
      <text x="58" y="30" class="font-bold" font-size="14" fill="#f1f5f9">DAC Autoplay</text>
      <text x="58" y="49" class="font-body" font-size="12" fill="#94a3b8">udev Hotplug Auto-Resume</text>
      <rect x="230" y="12" width="46" height="18" rx="9" fill="#059669" fill-opacity="0.25" />
      <text x="238" y="24" class="font-bold" font-size="10" fill="#34d399">Auto</text>
    </g>

    <!-- 2.4 Cloud Q&A Fallback -->
    <g transform="translate(16, 304)" filter="url(#cardShadow)">
      <rect width="288" height="68" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="32" cy="34" r="16" fill="#3b82f6" fill-opacity="0.2" />
      <text x="23" y="40" font-size="17">☁️</text>
      <text x="58" y="30" class="font-bold" font-size="14" fill="#f1f5f9">Cloud Fallback</text>
      <text x="58" y="49" class="font-body" font-size="12" fill="#94a3b8">Gemini / OpenAI (Text Q&amp;A)</text>
      <rect x="220" y="12" width="56" height="18" rx="9" fill="#1e3a8a" fill-opacity="0.4" />
      <text x="228" y="24" class="font-bold" font-size="10" fill="#93c5fd">Opt-in</text>
    </g>
  </g>

  <!-- ==================== COLUMN 3: OUTPUT ==================== -->
  <g transform="translate(820, 100)">
    <rect width="320" height="420" rx="14" fill="#0b1329" fill-opacity="0.5" stroke="#1e293b" stroke-width="1" />
    <text x="24" y="32" class="font-bold" font-size="13" fill="#c084fc" letter-spacing="1">DUAL AUDIO OUTPUT</text>

    <!-- 3.1 Hi-Res Bit-Perfect Music -->
    <g transform="translate(16, 48)" filter="url(#cardShadow)">
      <rect width="288" height="120" rx="10" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.5" />
      <circle cx="32" cy="34" r="16" fill="#a855f7" fill-opacity="0.25" />
      <text x="23" y="40" font-size="17">💎</text>
      <text x="58" y="30" class="font-bold" font-size="14" fill="#f1f5f9">USB DAC Direct ALSA</text>
      <text x="58" y="49" class="font-body" font-size="12" fill="#d8b4fe">Native Squeezelite · Bit-Perfect</text>
      
      <line x1="20" y1="65" x2="268" y2="65" stroke="#334155" stroke-width="1" />
      <text x="28" y="96" font-size="18">🔊</text>
      <text x="58" y="90" class="font-bold" font-size="13" fill="#38bdf8">Speakers &amp; Headphones</text>
      <text x="58" y="106" class="font-body" font-size="11" fill="#64748b">Fixed 100% Hardware Gain</text>
      
      <rect x="210" y="12" width="66" height="18" rx="9" fill="#7c3aed" fill-opacity="0.3" />
      <text x="217" y="24" class="font-bold" font-size="10" fill="#d8b4fe">Bit-Perfect</text>
    </g>

    <!-- 3.2 Isolated TTS & Chimes -->
    <g transform="translate(16, 178)" filter="url(#cardShadow)">
      <rect width="288" height="110" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="32" cy="34" r="16" fill="#0284c7" fill-opacity="0.2" />
      <text x="23" y="40" font-size="17">🗣️</text>
      <text x="58" y="30" class="font-bold" font-size="14" fill="#f1f5f9">Internal Speaker / 3.5mm</text>
      <text x="58" y="49" class="font-body" font-size="12" fill="#94a3b8">PulseAudio Isolated Path</text>
      
      <line x1="20" y1="65" x2="268" y2="65" stroke="#334155" stroke-width="1" />
      <text x="28" y="93" font-size="16">📢</text>
      <text x="58" y="87" class="font-bold" font-size="13" fill="#cbd5e1">TTS Answers &amp; Chimes</text>
      <text x="58" y="101" class="font-body" font-size="11" fill="#64748b">Never interrupts USB music</text>

      <rect x="220" y="12" width="56" height="18" rx="9" fill="#0369a1" fill-opacity="0.25" />
      <text x="228" y="24" class="font-bold" font-size="10" fill="#38bdf8">Isolated</text>
    </g>

    <!-- 3.3 Auto-Ducking -->
    <g transform="translate(16, 298)" filter="url(#cardShadow)">
      <rect width="288" height="68" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="32" cy="34" r="16" fill="#ca8a04" fill-opacity="0.2" />
      <text x="23" y="40" font-size="17">🎚️</text>
      <text x="58" y="30" class="font-bold" font-size="14" fill="#f1f5f9">Auto-Ducking</text>
      <text x="58" y="49" class="font-body" font-size="12" fill="#94a3b8">Ducks music to 18% during speech</text>
    </g>
  </g>

  <!-- ==================== FLOW ARROWS ==================== -->
  <path d="M 380 241 L 440 241" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arr-blue)" />
  <path d="M 380 160 L 410 160 L 410 85 L 440 85" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arr-blue)" />
  <path d="M 760 174 L 820 108" stroke="#34d399" stroke-width="2" fill="none" marker-end="url(#arr-green)" />
  <path d="M 760 85 L 790 85 L 790 233 L 820 233" stroke="#c084fc" stroke-width="2" fill="none" marker-end="url(#arr-purple)" />

  <!-- ==================== BOTTOM: TARGET HARDWARE ==================== -->
  <g transform="translate(60, 536)">
    <rect width="1080" height="74" rx="12" fill="#0b1329" fill-opacity="0.6" stroke="#1e293b" stroke-width="1" />
    
    <!-- Target 1: Phones -->
    <g transform="translate(30, 20)">
      <circle cx="18" cy="17" r="16" fill="#3b82f6" fill-opacity="0.15" />
      <text x="11" y="23" font-size="16">📱</text>
      <text x="44" y="16" class="font-bold" font-size="13" fill="#f1f5f9">Upcycled Phones</text>
      <text x="44" y="32" class="font-body" font-size="11" fill="#94a3b8">POCO F1 · OnePlus · Pixel</text>
    </g>

    <!-- Target 2: SBC -->
    <g transform="translate(420, 20)">
      <circle cx="18" cy="17" r="16" fill="#10b981" fill-opacity="0.15" />
      <text x="11" y="23" font-size="16">🍓</text>
      <text x="44" y="16" class="font-bold" font-size="13" fill="#f1f5f9">Single Board Computers</text>
      <text x="44" y="32" class="font-body" font-size="11" fill="#94a3b8">Raspberry Pi 4/5 · Orange Pi</text>
    </g>

    <!-- Target 3: Mini PC -->
    <g transform="translate(800, 20)">
      <circle cx="18" cy="17" r="16" fill="#8b5cf6" fill-opacity="0.15" />
      <text x="11" y="23" font-size="16">💻</text>
      <text x="44" y="16" class="font-bold" font-size="13" fill="#f1f5f9">Mini PCs &amp; Laptops</text>
      <text x="44" y="32" class="font-body" font-size="11" fill="#94a3b8">Intel NUC · x86_64 · Thin Clients</text>
    </g>
  </g>
</svg>
