services:
  stt:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    image: pocobox-stt:latest
    container_name: pocobox-stt
    restart: unless-stopped
    network_mode: host
    cpuset: "4-7"
    environment:
      - TZ=Asia/Seoul
      - STT_HOST=127.0.0.1
      - STT_PORT=8766
      - STT_LANG=ko
      - STT_USE_ITN=1
      - STT_THREADS=4
      - STT_ENGINE=sensevoice
      - STT_MODEL_DIR=/models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17
      - QWEN3_ASR_MODEL_DIR=/models/sherpa-onnx-qwen3-asr-0.6B-int8-2026-03-25
      - TTS_MODEL_DIR=/models/kokoro-int8-en-v0_19
      - TTS_KO_MODEL_DIR=/models/sherpa-onnx-supertonic-3-tts-int8-2026-05-11
    volumes:
      - /srv/pocobox/models:/models:ro
